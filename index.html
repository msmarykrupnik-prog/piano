<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пианино</title>
<style>
html,body{height:100%;margin:0;background:transparent;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;user-select:none}
.pbox{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.piano{position:relative}
.pimg{width:100%;height:100%;display:block;cursor:pointer;filter:drop-shadow(0 1.2vmin 1.6vmin rgba(0,0,0,.45));transition:transform .25s}
.app:not(.open) .pimg:hover{transform:scale(1.025)}
.app.open .pimg{cursor:default}
.vwin{position:absolute;left:34.542%;top:9.430%;width:31.621%;height:18.640%;overflow:hidden;background:#000;visibility:hidden}
.vwin video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.sh{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;transition:transform .9s cubic-bezier(.6,.05,.25,1);background:#2a1a10}
.sh.l{left:0}.sh.r{right:0}
.sh img{position:absolute;width:632.484%;height:auto;top:-50.588%;max-width:none}
.sh.l img{left:-218.471%}.sh.r img{left:-318.471%}
.vwin.open .sh.l{transform:translateX(-101%)}.vwin.open .sh.r{transform:translateX(101%)}
.msg{position:absolute;inset:auto 0 0 0;padding:.4em .6em;background:rgba(0,0,0,.7);color:#ecdfc3;font-size:clamp(9px,2vmin,13px);text-align:center;display:none}
.xbtn{position:absolute;top:10px;right:10px;z-index:3;display:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.pfs{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:100%!important;z-index:99}
.pfs video,.vwin:fullscreen video{object-fit:contain}
.pfs .xbtn,.vwin:fullscreen .xbtn{display:block}
.kb{height:0;overflow:hidden;transition:height .55s ease;background:rgba(25,18,12,.9);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-sizing:border-box}
.app.open .kb{height:36%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;padding:.5em .7em;color:#ecdfc3;font-size:clamp(9px,2.2vmin,13px)}
#cap{flex:1 1 90px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.bar button{background:rgba(236,223,195,.1);color:#ecdfc3;border:1px solid rgba(236,223,195,.35);border-radius:99px;padding:.3em .8em;font:inherit;cursor:pointer}
.bar button.on{background:#b8934f;color:#2a1a10;border-color:#b8934f}
.keys{position:relative;flex:1 1 0;min-height:0;display:flex;padding:0 .8em .7em}
.keys .in{position:relative;flex:1;display:flex;background:#1b100a;border-left:clamp(4px,1.2vmin,9px) solid #3b2113;border-right:clamp(4px,1.2vmin,9px) solid #3b2113;box-shadow:inset 0 6px 10px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.5);padding-top:clamp(3px,.9vmin,6px);box-sizing:border-box}
.keys .in::before{content:"";position:absolute;left:0;right:0;top:0;height:clamp(3px,.9vmin,6px);background:linear-gradient(#8a2a24,#521512);z-index:4;box-shadow:0 2px 3px rgba(0,0,0,.6);pointer-events:none}
.w{position:relative;flex:1;margin:0 .6px;padding:0;cursor:pointer;border:0;border-radius:0 0 .7vmin .7vmin;
 background:linear-gradient(90deg,rgba(90,70,30,.16),rgba(255,255,255,0) 7%,rgba(255,255,255,0) 92%,rgba(90,70,30,.2)),linear-gradient(180deg,#f3ecd8 0%,#f8f3e3 55%,#ece3c9 88%,#d8ccab 100%);
 box-shadow:inset 0 1px 0 #fffdf3,inset 0 -3px 5px rgba(120,95,45,.3),0 2px 3px rgba(0,0,0,.55);
 transform-origin:50% 0;transition:transform .07s,filter .07s}
.w::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;border-radius:0 0 .7vmin .7vmin;background:linear-gradient(#d7cba9,#b5a883);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.w:active,.w.p{transform:translateY(1.2px) scaleY(.992);filter:brightness(.9);box-shadow:inset 0 5px 7px rgba(60,40,10,.4),0 1px 1px rgba(0,0,0,.5)}
.b{position:absolute;top:calc(clamp(3px,.9vmin,6px) - 1px);height:calc(62% - clamp(3px,.9vmin,6px));width:4.4%;margin-left:-.1%;padding:0;cursor:pointer;z-index:2;border:0;border-radius:0 0 .6vmin .6vmin;
 background:linear-gradient(90deg,#000 0%,#2b2b2b 10%,#0d0d0d 32%,#050505 66%,#1e1e1e 90%,#000 100%);
 box-shadow:0 4px 5px rgba(0,0,0,.65),3px 0 4px rgba(0,0,0,.4),-1px 0 2px rgba(0,0,0,.4);transform-origin:50% 0;transition:transform .07s,filter .07s}
.b::before{content:"";position:absolute;left:20%;top:3%;width:20%;height:68%;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.02))}
.b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15%;border-radius:0 0 .6vmin .6vmin;background:linear-gradient(#3d3d3d,#0f0f0f)}
.b:active,.b.p{transform:translateY(1.5px) scaleY(.99);filter:brightness(.85)}
</style></head><body>
<div class="app" id="app">
 <div class="pbox" id="pbox"><div class="piano" id="piano">
  <img class="pimg" id="pimg" alt="Пианино">
  <div class="vwin" id="vwin"><video id="vid" playsinline preload="none"></video>
   <div class="sh l"><img alt=""></div><div class="sh r"><img alt=""></div>
   <div class="msg" id="msg"></div><button class="xbtn" id="xbtn" aria-label="Закрыть">✕</button></div>
 </div></div>
 <div class="kb" id="kb">
  <div class="bar"><span id="cap">нажмите на клавишу</span>
   <button id="mw" class="on">▢ в окошке</button><button id="mf">⛶ на весь экран</button>
   <button id="stop">закрыть заслонки</button><button id="hide" aria-label="Скрыть клавиатуру">▾</button></div>
  <div class="keys"><div class="in" id="keys"></div></div>
 </div>
</div>

const $=id=>document.getElementById(id);
const app=$('app'),vwin=$('vwin'),vid=$('vid'),piano=$('piano'),pbox=$('pbox');
$('pimg').src=PIANO;document.querySelectorAll('.sh img').forEach(i=>i.src=PIANO);
/* подгонка пианино под рамку */
const RATIO=1.08882;
function fit(){const bw=pbox.clientWidth,bh=pbox.clientHeight,w=Math.min(bw,bh*RATIO);piano.style.width=w+'px';piano.style.height=(w/RATIO)+'px'}
new ResizeObserver(fit).observe(pbox);fit();
/* клавиатура: 2 октавы */
const WO=[0,2,4,5,7,9,11],BO=[1,3,6,8,10],BP=[1,2,4,5,6];
const keys=[];
for(let i=0;i<14;i++)keys.push({t:'w',x:i+.5,f:261.63*Math.pow(2,((WO[i%7]+12*Math.floor(i/7)))/12),idx:i});
for(let o=0;o<2;o++)for(let k=0;k<5;k++)keys.push({t:'b',x:BP[k]+7*o,f:261.63*Math.pow(2,(BO[k]+12*o)/12),idx:k});
keys.sort((a,b)=>a.x-b.x);
const kc=$('keys');
keys.forEach((k,n)=>{const b=document.createElement('button');b.className=k.t;b.setAttribute('aria-label','клавиша '+(n+1));
 if(k.t==='b'){b.style.left='calc('+(k.x/14*100)+'% - 2.2%)'}
 else{b.style.flex='1'}
 const press=e=>{e.preventDefault();b.classList.add('p');setTimeout(()=>b.classList.remove('p'),160);note(k.f);if(k.t==='w'&&MAP[k.idx]!==undefined)play(MAP[k.idx])};
 b.addEventListener('pointerdown',press);kc.appendChild(b)});
/* звук */
let ac=null;
function note(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+1.3);g.connect(ac.destination);
 [['triangle',f,1],['sine',f*2,.25]].forEach(([ty,fr,v])=>{const o=ac.createOscillator(),gg=ac.createGain();o.type=ty;o.frequency.value=fr;gg.gain.value=v;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+1.4)})}catch(e){}}
/* видео */
let mode='window',pfs=false;
function setBtn(){$('mw').classList.toggle('on',mode==='window');$('mf').classList.toggle('on',mode==='full')}
function play(n){const v=VIDEOS[n%VIDEOS.length];$('msg').style.display='none';
 vid.src=v.src;vid.currentTime=0;vid.play().catch(()=>{});$('cap').textContent='▶ '+v.title;
 if(!vwin.classList.contains('open')){vwin.style.visibility='visible';void vwin.offsetWidth;vwin.classList.add('open')}
 if(mode==='full')enterFS()}
vid.onerror=()=>{const m=$('msg');m.textContent='файл не найден: '+decodeURIComponent((vid.getAttribute('src')||''));m.style.display='block'};
vid.onended=()=>{};
function enterFS(){if(document.fullscreenElement||pfs)return;
 const f=vwin.requestFullscreen&&vwin.requestFullscreen();
 if(f&&f.catch)f.catch(pseudo);else if(!f)pseudo();
 vid.controls=true}
function pseudo(){if(pfs)return;pfs=true;vwin.classList.add('pfs');document.body.appendChild(vwin);vid.play().catch(()=>{});vid.controls=true}
function exitFS(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 if(pfs){pfs=false;vwin.classList.remove('pfs');piano.appendChild(vwin);vid.play().catch(()=>{})}
 vid.controls=false}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){vid.controls=false;if(mode==='full'&&!pfs){mode='window';setBtn()}}});
$('mw').onclick=()=>{mode='window';setBtn();exitFS()};
$('mf').onclick=()=>{mode='full';setBtn();if(vwin.classList.contains('open'))enterFS()};
$('xbtn').onclick=()=>{mode='window';setBtn();exitFS()};
vwin.addEventListener('dblclick',()=>{if(document.fullscreenElement||pfs){mode='window';setBtn();exitFS()}else{mode='full';setBtn();enterFS()}});
vid.addEventListener('click',()=>{if(!vid.controls)vid.paused?vid.play():vid.pause()});
function stop(){vid.pause();exitFS();mode='window';setBtn();vwin.classList.remove('open');$('cap').textContent='нажмите на клавишу';
 setTimeout(()=>{if(!vwin.classList.contains('open'))vwin.style.visibility='hidden'},950)}
$('stop').onclick=stop;
/* открыть / скрыть клавиатуру */
const open=()=>app.classList.add('open');
$('pimg').onclick=()=>{if(!app.classList.contains('open'))open()};
$('hide').onclick=()=>{stop();app.classList.remove('open')};
</script></body></html>
